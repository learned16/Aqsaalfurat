<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مكتب أقصى الفرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
/* Layout: the office fills the stage; a control sheet sits on the right (RTL start). Light look that matches the real office: white, charcoal, walnut and gold. Single theme by choice. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --raised:#f4f5f6; --line:#dcdfe3;
  --fg:#1d2124; --muted:#5f6870;
  --gold:#a8792a; --gold-soft:#f3e7cf; --walnut:#5a3524; --ink:#1d2124;
  --ok:#23845a; --info:#2c6fae; --off:#b8443a;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.6}
.app{display:grid;grid-template-columns:minmax(290px,350px) 1fr;grid-template-rows:auto 1fr;grid-template-areas:"bar bar" "panel stage";height:100%}
.bar{grid-area:bar;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:12px 20px;background:var(--ink);color:#fff}
.bar h1{margin:0;font-family:var(--display);font-size:20px;font-weight:700;color:#e9c77e}
.bar small{color:#c9cdd1}
.mode{font-size:12px;font-weight:600;color:var(--ink);background:#e9c77e;border-radius:4px;padding:1px 8px}
.clock{margin-inline-start:auto;color:#c9cdd1;font-variant-numeric:tabular-nums}
.stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden;background:#dfe2e5}
#c{display:block;width:100%;height:100%;touch-action:none}
.spot{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:600;color:#fff;background:rgba(29,33,36,.82);border:1px solid rgba(233,199,126,.7);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;white-space:nowrap}
.spot::before{content:"";width:8px;height:8px;border-radius:50%;background:#e9c77e;animation:ping 1.8s infinite}
.spot.on{background:#e9c77e;color:var(--ink)}
.spot.on::before{background:var(--ink)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(233,199,126,.8)}70%{box-shadow:0 0 0 9px rgba(233,199,126,0)}100%{box-shadow:0 0 0 0 rgba(233,199,126,0)}}
.hint{position:absolute;inset-block-end:12px;inset-inline-end:12px;font-size:12px;color:#fff;background:rgba(29,33,36,.75);padding:6px 10px;border-radius:6px;pointer-events:none}
.panel{grid-area:panel;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;border-inline-end:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.04em}
.card h2{margin:0;font-family:var(--display);font-size:21px;font-weight:700;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.state{display:flex;align-items:center;gap:8px;font-weight:600}
.state i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.state.off i{background:var(--off)} .state.busy i{background:var(--info)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--raised);color:var(--fg);text-decoration:none;display:inline-block}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#e9c77e}
.btn:hover{filter:brightness(.96)}
.btn.primary:hover{filter:brightness(1.25)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible,.spot:focus-visible,input:focus-visible,.pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.picks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{width:100%;text-align:start;font:inherit;color:var(--fg);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.pick:hover{border-color:var(--gold)}
.pick b{display:block;font-family:var(--display);font-weight:500}
.pick span{font-size:12px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{display:grid;grid-template-columns:1fr auto;gap:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.sec{margin:0;font-size:12px;color:var(--muted);font-weight:600}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
dl.facts dt{color:var(--muted)} dl.facts dd{margin:0;font-weight:500}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;grid-template-areas:"bar" "stage" "panel";height:auto}
  .app{grid-template-rows:auto 60svh auto}
  .panel{overflow:visible;border:0}
  .bar{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){.spot::before{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>مكتب أقصى الفرات</h1><small>كركوك</small><span class="mode" id="mode">تجربة</span>
    <span class="clock" id="hdr-clock"></span>
  </header>
  <aside class="panel">
    <section class="card" id="sheet" aria-live="polite"></section>
    <section class="card">
      <h3 class="sec">سجل الأوامر</h3>
      <ul class="log" id="log"></ul>
    </section>
    <p class="note" id="note"></p>
  </aside>
  <main class="stage" id="stage">
    <canvas id="c" aria-label="المكتب ثلاثي الأبعاد"></canvas>
    <div id="spots"></div>
    <div class="hint">اسحب حتى تتلفت بالمكتب · اضغط على أي شي مأشر</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// on the Cloudflare relay the page lives at /office and can reach the bot; anywhere else it is a demo
const LIVE = location.pathname.indexOf("/office") === 0;
const ARCHIVE = "https://drive.google.com/drive/folders/18ypIMmqpsXTlMFNFN0LtX64V0ipAUXSY";
const NAME = "أقصى الفرات", SUB = "للمقاولات والتجارة العامة";
const $ = id => document.getElementById(id);

function kirkukNow(){
  const parts = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Baghdad",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => +parts.find(p => p.type === t).value;
  return {h:g("hour")%24, m:g("minute"), s:g("second")};
}
const pad2 = n => String(n).padStart(2,"0");
const hm = t => pad2(t.h)+":"+pad2(t.m);
const today = () => new Intl.DateTimeFormat("ar-IQ-u-nu-latn",{timeZone:"Asia/Baghdad",weekday:"long",day:"numeric",month:"long"}).format(new Date());

// ---------- renderer ----------
const canvas = $("c"), stage = $("stage");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe2e5);
const camera = new THREE.PerspectiveCamera(52, 1, 0.05, 60);
camera.position.set(0.6, 1.7, 3.2);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 1.05, -2.0);
Object.assign(controls, {enableDamping:true, enablePan:false, minDistance:1.2, maxDistance:5.6, minPolarAngle:0.9, maxPolarAngle:1.6, minAzimuthAngle:-0.75, maxAzimuthAngle:0.75});
controls.update();

// ---------- helpers ----------
function mat(color, o){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:.8, metalness:0}, o||{})); }
function box(w,h,d,m,x,y,z,parent){ const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); b.position.set(x,y,z); b.castShadow = b.receiveShadow = true; (parent||scene).add(b); return b; }
function cyl(rt,rb,h,m,x,y,z,parent,seg){ const c = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24), m); c.position.set(x,y,z); c.castShadow = c.receiveShadow = true; (parent||scene).add(c); return c; }
function canvasTex(w,h,draw){ const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; t.userData = {cv, ctx:cv.getContext("2d"), draw}; if (draw) { draw(t.userData.ctx, w, h); t.needsUpdate = true; } return t; }
function redraw(t){ t.userData.draw(t.userData.ctx, t.userData.cv.width, t.userData.cv.height); t.needsUpdate = true; }
const rnd = (i => () => { i = (i*16807) % 2147483647; return i/2147483647; })(42);

// the company logo: sun, birds, palm island, river, citadel on its mound
function drawLogo(c, cx, cy, s){
  c.save(); c.translate(cx, cy); c.scale(s, s);
  const sun = c.createLinearGradient(0,-120,0,10); sun.addColorStop(0,"#e8452c"); sun.addColorStop(.6,"#f39a2b"); sun.addColorStop(1,"#ffd34d");
  c.fillStyle = sun; c.beginPath(); c.arc(0,10,120,Math.PI,0); c.fill();
  c.strokeStyle = "#3a2a20"; c.lineWidth = 3;
  for (const [bx,by] of [[30,-70],[50,-60],[68,-66],[86,-56]]) { c.beginPath(); c.moveTo(bx-7,by); c.quadraticCurveTo(bx-3,by-5,bx,by); c.quadraticCurveTo(bx+3,by-5,bx+7,by); c.stroke(); }
  c.fillStyle = "#e9a23b"; c.beginPath(); c.moveTo(-170,30); c.lineTo(-90,-20); c.lineTo(-30,25); c.fill();
  c.fillStyle = "#b83a2c"; c.beginPath(); c.moveTo(20,30); c.quadraticCurveTo(110,-10,210,35); c.lineTo(20,35); c.fill();
  c.fillStyle = "#c9762f"; c.fillRect(70,-40,90,45);
  for (let i=0;i<6;i++) c.fillRect(70+i*16,-50,9,12);
  c.fillRect(95,-62,26,26); c.fillStyle = "#8a4a22"; c.fillRect(104,-30,9,14); c.fillRect(132,-28,7,10);
  c.fillStyle = "#3f8c3a"; c.beginPath(); c.ellipse(-120,32,70,12,0,0,Math.PI*2); c.fill();
  c.strokeStyle = "#2c2420"; c.lineWidth = 7; c.beginPath(); c.moveTo(-125,30); c.quadraticCurveTo(-118,-20,-112,-62); c.stroke();
  c.fillStyle = "#1f2a24";
  for (let k=0;k<6;k++){ const a = -Math.PI*0.95 + k*Math.PI/5.5; c.beginPath(); c.moveTo(-112,-62); c.quadraticCurveTo(-112+Math.cos(a)*30,-62+Math.sin(a)*30-10,-112+Math.cos(a)*55,-62+Math.sin(a)*45+12); c.quadraticCurveTo(-112+Math.cos(a)*30,-62+Math.sin(a)*20,-112,-62); c.fill(); }
  const river = c.createLinearGradient(-200,0,200,60); river.addColorStop(0,"#1f5fae"); river.addColorStop(.5,"#46b3e6"); river.addColorStop(1,"#1d3f8f");
  c.fillStyle = river; c.beginPath(); c.moveTo(-210,48); c.bezierCurveTo(-80,10,40,70,220,40); c.lineTo(220,58); c.bezierCurveTo(40,90,-90,30,-210,60); c.fill();
  c.fillStyle = "#cfe9f7"; c.beginPath(); c.moveTo(-150,46); c.bezierCurveTo(-60,26,20,60,120,48); c.bezierCurveTo(20,66,-60,36,-150,50); c.fill();
  c.strokeStyle = "#c9953e"; c.lineWidth = 4; c.beginPath(); c.moveTo(-205,64); c.lineTo(215,62); c.stroke();
  c.restore();
}
function goldText(c, text, x, y, size, weight){
  c.font = `${weight||700} ${size}px "Readex Pro", Tahoma, sans-serif`;
  c.direction = "rtl"; c.textAlign = "center";
  c.fillStyle = "rgba(90,60,20,.45)"; c.fillText(text, x+2, y+3);
  const g = c.createLinearGradient(0,y-size,0,y); g.addColorStop(0,"#f6dc8f"); g.addColorStop(.5,"#c9953e"); g.addColorStop(1,"#e7c06a");
  c.fillStyle = g; c.fillText(text, x, y);
}

// ---------- room ----------
const carpetTex = canvasTex(512,512,(c,w,h)=>{ c.fillStyle="#b9b3a8"; c.fillRect(0,0,w,h); for (let i=0;i<26000;i++){ const v = 140+Math.floor(rnd()*70); c.fillStyle=`rgba(${v},${v-4},${v-12},.55)`; c.fillRect(rnd()*w, rnd()*h, 1.4, 1.4); } });
carpetTex.wrapS = carpetTex.wrapT = THREE.RepeatWrapping; carpetTex.repeat.set(5,5);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8,7.2), new THREE.MeshStandardMaterial({map:carpetTex, roughness:1}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const wallM = mat(0xf4f5f6,{roughness:.92});
const back = new THREE.Mesh(new THREE.PlaneGeometry(8,3), wallM); back.position.set(0,1.5,-3.5); back.receiveShadow = true; scene.add(back);
const left = new THREE.Mesh(new THREE.PlaneGeometry(7.2,3), wallM); left.rotation.y = Math.PI/2; left.position.set(-4,1.5,0.1); left.receiveShadow = true; scene.add(left);
const right = new THREE.Mesh(new THREE.PlaneGeometry(7.2,3), wallM); right.rotation.y = -Math.PI/2; right.position.set(4,1.5,0.1); right.receiveShadow = true; scene.add(right);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(8,7.2), mat(0xf7f8f9,{roughness:1})); ceil.rotation.x = Math.PI/2; ceil.position.set(0,3,0.1); scene.add(ceil);
box(8,.08,.02,mat(0xe7e8ea),0,.04,-3.49); box(.02,.08,7.2,mat(0xe7e8ea),-3.99,.04,.1); box(.02,.08,7.2,mat(0xe7e8ea),3.99,.04,.1);

// ceiling: linear LED strips and downlights, like the real office
const ledOn = new THREE.MeshBasicMaterial({color:0xffffff, toneMapped:false});
const spotOn = new THREE.MeshBasicMaterial({color:0xcfe4ff, toneMapped:false});
const ledOff = new THREE.MeshBasicMaterial({color:0xb9bcc0});
const leds = [], downs = [];
[[-1.6,-1.2,.55],[-1.1,.4,.55],[1.6,-.6,-.6],[2.0,1.4,-.6]].forEach(([x,z,ry])=>{ const l = new THREE.Mesh(new THREE.BoxGeometry(2.4,.015,.045), ledOn); l.position.set(x,2.99,z); l.rotation.y = ry; scene.add(l); leds.push(l); });
[[-2.6,-2.6],[-2.1,-2.6],[-1.6,-2.6],[1.6,-2.6],[2.1,-2.6],[2.6,-2.6],[-.5,1.2],[0,1.2],[.5,1.2]].forEach(([x,z])=>{ const d = new THREE.Mesh(new THREE.CircleGeometry(.05,20), spotOn); d.rotation.x = Math.PI/2; d.position.set(x,2.985,z); scene.add(d); downs.push(d); });

// ---------- feature wall ----------
const marbleTex = canvasTex(640,1080,(c,w,h)=>{
  const g = c.createLinearGradient(0,0,w,h); g.addColorStop(0,"#f3f4f5"); g.addColorStop(1,"#e4e6e9"); c.fillStyle = g; c.fillRect(0,0,w,h);
  for (let i=0;i<14;i++){ let x = rnd()*w, y = rnd()*h*.3; c.beginPath(); c.moveTo(x,y);
    for (let k=0;k<8;k++){ x += (rnd()-.45)*110; y += 70+rnd()*90; c.lineTo(x,y); }
    c.strokeStyle = i%3 ? "rgba(120,124,130,.35)" : "rgba(196,150,60,.55)"; c.lineWidth = .8+rnd()*2.2; c.stroke(); }
  drawLogo(c, w/2, 300, 1.05);
  goldText(c, NAME, w/2, 470, 84);
  goldText(c, SUB, w/2, 535, 34, 600);
});
fontsReady.then(()=>redraw(marbleTex));
const marble = new THREE.Mesh(new THREE.PlaneGeometry(1.6,2.7), new THREE.MeshStandardMaterial({map:marbleTex, roughness:.4, metalness:0}));
marble.position.set(0,1.35,-3.46); scene.add(marble);
const warmLed = new THREE.MeshBasicMaterial({color:0xffe7b0, toneMapped:false});
box(.02,2.7,.02,warmLed,-.81,1.35,-3.45); box(.02,2.7,.02,warmLed,.81,1.35,-3.45); box(1.64,.02,.02,warmLed,0,2.7,-3.45);
const wallGlow = new THREE.PointLight(0xffe2a8,.35,2.2); wallGlow.position.set(0,2.2,-3.1); scene.add(wallGlow);
const walnutTex = canvasTex(256,1024,(c,w,h)=>{ c.fillStyle="#5d3726"; c.fillRect(0,0,w,h); for (let i=0;i<70;i++){ const x = rnd()*w; c.strokeStyle=`rgba(${rnd()>.5?30:120},${rnd()>.5?16:70},10,.25)`; c.lineWidth=1+rnd()*3; c.beginPath(); c.moveTo(x,0); c.bezierCurveTo(x+rnd()*20-10,h*.3,x+rnd()*20-10,h*.7,x+rnd()*14-7,h); c.stroke(); } });
const walnutM = new THREE.MeshStandardMaterial({map:walnutTex, roughness:.45});
const slatM = mat(0x111214,{roughness:.75});
for (const s of [-1,1]) {
  box(.7,2.7,.04,walnutM,s*1.15,1.35,-3.47);
  box(.62,2.7,.02,mat(0x2a2c30),s*1.82,1.35,-3.48);
  for (let i=0;i<6;i++) box(.055,2.7,.05,slatM,s*(1.55+i*.105),1.35,-3.45);
}

// ---------- manager desk ----------
const white = mat(0xf7f7f6,{roughness:.18});
const black = mat(0x1e2023,{roughness:.35});
const desk = new THREE.Group(); desk.position.set(0,0,-2.35); scene.add(desk);
box(1.9,.06,.85,white,0,.75,0,desk);
for (const s of [-1,1]) { box(.09,.72,.8,white,s*.9,.36,0,desk); box(.095,.72,.1,black,s*.9,.36,.2,desk); box(.095,.72,.1,black,s*.9,.36,-.2,desk); }
box(1.7,.5,.04,white,0,.47,.3,desk); box(.08,.5,.045,black,-.35,.47,.3,desk); box(.08,.5,.045,black,.35,.47,.3,desk);
box(1.3,.04,.55,white,1.55,.62,-.05,desk); box(.5,.6,.5,white,1.95,.3,-.05,desk); box(.5,.04,.04,black,1.95,.45,.21,desk);
// executive chair (white leather)
const chair = new THREE.Group(); chair.position.set(0,0,-2.95); scene.add(chair);
const leather = mat(0xf2f1ee,{roughness:.45}), chrome = mat(0xc8ccd0,{metalness:.9,roughness:.25});
box(.58,.12,.55,leather,0,.5,0,chair); box(.58,.85,.12,leather,0,1.0,-.24,chair); box(.5,.14,.13,leather,0,1.45,-.25,chair);
cyl(.03,.03,.38,chrome,0,.27,0,chair);
for (let i=0;i<5;i++){ const a = i*Math.PI*2/5; const leg = box(.32,.03,.04,chrome,Math.cos(a)*.15,.05,Math.sin(a)*.15,chair); leg.rotation.y = -a; }
// desk props: wire tray, name plate, papers
const tray = new THREE.Group(); tray.position.set(-.55,.78,-2.45); scene.add(tray);
for (let i=0;i<2;i++) box(.34,.01,.26,black,0,.02+i*.08,0,tray);
for (const x of [-.16,.16]) box(.01,.1,.26,black,x,.05,0,tray);
box(.21,.003,.297,mat(0xffffff,{roughness:.9}),-.55,.88,-2.45);
const plateTex = canvasTex(512,128,(c,w,h)=>{ c.fillStyle="#1e2023"; c.fillRect(0,0,w,h); c.direction="rtl"; c.textAlign="center"; c.fillStyle="#e9c77e"; c.font='600 40px "IBM Plex Sans Arabic", Tahoma'; c.fillText("المدير المفوض", w/2, 58); c.font='500 32px "IBM Plex Sans Arabic", Tahoma'; c.fillStyle="#f1f1f1"; c.fillText("حسين حمود عبد", w/2, 104); });
fontsReady.then(()=>redraw(plateTex));
const plate = new THREE.Mesh(new THREE.BoxGeometry(.3,.075,.01), [black,black,black,black,new THREE.MeshStandardMaterial({map:plateTex, roughness:.3}),black]);
plate.position.set(.05,.82,-1.96); plate.rotation.x = -.35; plate.castShadow = true; scene.add(plate);

// ---------- laptop (black) ----------
const laptop = new THREE.Group(); laptop.position.set(.45,.78,-2.4); laptop.rotation.y = -.25; scene.add(laptop);
const lapM = mat(0x18191b,{roughness:.4});
box(.36,.02,.25,lapM,0,.01,0,laptop);
box(.31,.002,.11,mat(0x0e0f10),0,.021,-.03,laptop);
const hinge = new THREE.Group(); hinge.position.set(0,.02,-.125); hinge.rotation.x = -.3; laptop.add(hinge);
box(.36,.24,.012,lapM,0,.12,0,hinge);
const screenTex = canvasTex(640,420,null);
let screenState = {mode:"home", text:""};
screenTex.userData.draw = (c,w,h)=>{
  if (screenState.mode === "off") { c.fillStyle="#040404"; c.fillRect(0,0,w,h); return; }

const PIN_KEY = "aqsa-office-pin";
function getPin(){ try { return localStorage.getItem(PIN_KEY) || ""; } catch(e) { return ""; } }

function renderMode(){
  $("mode").textContent = !LIVE ? "تجربة" : getPin() ? "مربوط بالبوت" : "غير مربوط";
  $("note").textContent = LIVE ? "كل أمر من اللابتوب أو الطابعة يوصل للبوت ولبرنامج المكتب على اللابتوب." : "هاي نسخة تجربة. النسخة المربوطة بالبوت تنفتح من رابط الوسيط /office.";

async function send(cmd, label){
  if (!LIVE) return false;
  const pin = getPin();
  if (!pin) { afterPin = current; current = "pin"; renderSheet(); return false; }
  try {
    const r = await fetch("/office/cmd", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({pin, cmd, text:label})});
    if (r.status === 403) { setPin(""); addLog("الرمز غلط، اكتبه مرة ثانية"); afterPin = current; current = "pin"; renderSheet(); return false; }
    if (!r.ok) throw new Error(r.status);
    addLog("وصل للبوت ✓"); return true;
  } catch(e) { addLog("ما وصل للبوت، تأكد من النت"); return false; }
}
async function checkReal(){
  const pin = getPin(); if (!LIVE || !pin) return;
  try {
    const r = await fetch("/office/status", {headers:{"X-Office-Pin":pin}});
    if (!r.ok) return;
    const d = await r.json();
    const mins = d.seen ? Math.round((d.now - d.seen)/60000) : null;
    real.text = !d.kv ? "طابور اللابتوب مو مربوط بعد (OFFICE_KV)." :
      mins === null ? "برنامج اللابتوب ما اتصل بعد." :
      mins <= 5 ? "اللابتوب الحقيقي متصل ✓" : `اللابتوب الحقيقي مو متصل (آخر مرة قبل ${mins} دقيقة).`;
    if (current === "laptop") renderSheet();
  } catch(e) {}
}

    <span class="eyebrow">المشاريع</span>
    <h2>أرشيف الشركة</h2>
    <p>ملفات المناقصات والمشاريع بمجلد الأرشيف بالدرايف. ينفتح بصفحة جديدة.</p>
    <div class="actions"><a class="btn primary" href="${ARCHIVE}" target="_blank" rel="noopener">افتح الأرشيف</a></div>`,
  lights: () => `
    <span class="eyebrow">الإضاءة</span>
    <h2>إضاءة السقف</h2>
    <div class="state ${lightsOn?"":"off"}"><i></i>${lightsOn?"شغّالة":"مطفية"}</div>
    <div class="actions"><button class="btn primary" data-act="lights">${lightsOn?"طفّي الإضاءة":"شغّل الإضاءة"}</button></div>`
};
function renderSheet(){ $("sheet").innerHTML = SHEETS[current||"home"](); Object.values(HOT).forEach(h=>h.el.classList.toggle("on", h === HOT[current])); }
function open(k){ current = k; renderSheet(); glide(k); }

function setScreen(mode, text){ screenState = {mode, text:text||""}; redraw(screenTex); }
function runPrint(label){ busy = true; renderSheet(); setScreen("busy","جاري الطباعة…"); ledM.color.set(0x2c6fae); addLog(label); printAnim = {t0:performance.now()+700, dur:reduced?10:2200}; paper.visible = false; }
function finishPrint(){ busy = false; setScreen("done","انطبعت ✓"); ledM.color.set(0x2fbf71); addLog("انطبعت بالمكتب الافتراضي"); renderSheet(); setTimeout(()=>{ if (!busy && laptopOn) setScreen("home"); }, 2500); }

$("sheet").addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) { open(o.dataset.open); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  const act = a.dataset.act;
  if (act === "unpin") { setPin(""); addLog("انفصل هذا الجهاز"); current = null; renderSheet(); return; }
  if (act === "print") { runPrint("اطبع صفحة تجربة"); send("print", "اطبع صفحة تجربة"); }
  if (act === "sleep" || act === "lock") { const lbl = act === "sleep" ? "نوّم اللابتوب" : "اقفل الشاشة"; addLog(lbl); send(act, lbl); }
  if (act === "lights") { setLights(!lightsOn); addLog(lightsOn ? "شغّل الإضاءة" : "طفّي الإضاءة"); renderSheet(); }
  if (act === "off") { busy = true; renderSheet(); setScreen("busy","دا يطفي…"); addLog("طفّي اللابتوب"); send("shutdown", "طفّي اللابتوب");
    setTimeout(()=>{ busy = false; laptopOn = false; setScreen("off"); ledM.color.set(0x333333); renderSheet(); }, reduced?10:1600); }
  if (act === "on") { laptopOn = true; setScreen("home"); ledM.color.set(0x2fbf71); addLog("شغّل اللابتوب"); send("wake", "شغّل اللابتوب"); renderSheet(); }
  if (act === "restart") { busy = true; renderSheet(); setScreen("busy","إعادة تشغيل…"); addLog("إعادة تشغيل"); send("restart", "إعادة تشغيل");
    setTimeout(()=>setScreen("off"), reduced?5:1200); setTimeout(()=>{ busy = false; setScreen("home"); renderSheet(); }, reduced?10:2600); }
});
$("sheet").addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "pinf") { const v = $("pin").value.trim(); if (!v) return; setPin(v); addLog("انحفظ الرمز"); current = afterPin && afterPin !== "pin" ? afterPin : null; afterPin = null; renderSheet(); checkReal(); return; }
  if (e.target.id !== "askf") return;
  const v = $("ask").value.trim(); if (!v) return;
  send("text", v.slice(0,300));
  busy = true; renderSheet(); setScreen("busy","دا يرسل…"); addLog(esc(v));
  setTimeout(()=>{ busy = false; setScreen("done","وصلت الرسالة ✓"); renderSheet(); setTimeout(()=>{ if (!busy && laptopOn) setScreen("home"); }, 2500); }, reduced?10:1500);
});

// ---------- loop ----------
function resize(){ const w = stage.clientWidth, h = stage.clientHeight; if (!w||!h) return; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const v3 = new THREE.Vector3();
let lastSec = -1, lastMin = -1;
function tick(now){
  if (tween) { const k = Math.min(1,(now-tween.t0)/tween.dur), e = k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(tween.fp,tween.tp,e); controls.target.lerpVectors(tween.ft,tween.tt,e); if (k>=1) tween = null; }
  if (printAnim) { const k = (now-printAnim.t0)/printAnim.dur;
    if (k >= 0) { paper.visible = true; const e = Math.min(1,k); paper.position.set(0,.08,.03+.27*e); paper.rotation.x = -.05*e; }
    if (k >= 1) { printAnim = null; finishPrint(); } }
  if (screenState.mode === "busy") redraw(screenTex);
  const t = kirkukNow();
  if (t.s !== lastSec) { lastSec = t.s; $("hdr-clock").textContent = "كركوك " + hm(t);
    if (t.m !== lastMin) { lastMin = t.m; redraw(tvTex); if (screenState.mode === "home") redraw(screenTex); } }
  controls.update();
  renderer.render(scene,camera);
  const r = canvas.getBoundingClientRect();
  Object.values(HOT).forEach(h=>{ v3.copy(h.at).project(camera); const vis = v3.z < 1 && Math.abs(v3.x) < 1.02 && Math.abs(v3.y) < 1.02;
    h.el.hidden = !vis; if (vis) h.el.style.transform = `translate(${(v3.x*.5+.5)*r.width}px,${(-v3.y*.5+.5)*r.height}px) translate(-50%,-50%)`; });
  requestAnimationFrame(tick);
}
fontsReady.then(()=>{ redraw(screenTex); redraw(tvTex); });
renderMode(); renderSheet(); renderLog(); checkReal(); setInterval(checkReal, 30000);
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
